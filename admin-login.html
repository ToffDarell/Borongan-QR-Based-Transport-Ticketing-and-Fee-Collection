<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borongan Transport · Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <link rel="stylesheet" href="assets/css/admin-login.css" />
</head>

<body>

    <div class="w-full">
        <img src="images/borongan.jpg" alt="Borongan City Transport" class="hero-banner" />
    </div>

    <div class="flex justify-center mt-10 mb-10 px-4">

        <div class="login-card">

            <div class="text-center">
                <div class="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center mx-auto mb-3 border border-gray-100">
                    <img src="images/borongan-logo.jpg" alt="Borongan Transport Logo" class="w-9 h-9 object-contain">
                </div>
                <span class="role-tag">Admin Access</span>
                <h1 class="text-2xl font-bold text-[#1e293b] mt-1">Borongan Transport</h1>
                <p class="text-muted-sm text-sm mb-5">Sign in to manage your transport system</p>
            </div>

            <div id="errorMsg" class="alert-error">
                 Invalid email or password. Please try again.
            </div>

            <form id="loginForm" onsubmit="return false;">

                <div class="mb-4">
                    <label class="block font-semibold text-[#334155] mb-1.5 text-sm">
                        Admin Username
                    </label>
                    <input type="text" id="username" class="input-field" placeholder="Enter admin username" autocomplete="off" />
                </div>

                <div class="mb-4">
                    <label class="block font-semibold text-[#334155] mb-1.5 text-sm">
                         Password
                    </label>
                    <div class="pw-wrapper">
                        <input type="password" id="password" class="input-field" placeholder="Enter admin password" autocomplete="off" />
                        <button type="button" id="togglePass" class="toggle-pw" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm mb-4">
                    <label class="flex items-center gap-2 text-[#334155] cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe" />
                        <span>Remember Me</span>
                    </label>
                    <button type="button" id="forgotBtn" class="link-accent text-sm bg-transparent border-0 cursor-pointer">
                        Forgot Password?
                    </button>
                </div>

                <div id="formMsg" class="text-center text-sm h-6 mb-2"></div>

                <button type="submit" id="loginBtn" class="btn-login">
                     Login as Admin
                </button>

                <div class="text-center mt-4">
                    <span class="text-xs text-[#5a7489]">Return to </span>
                    <a href="login.html" class="link-accent text-xs">Driver Login</a>
                </div>

            </form>

        </div>

    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal-box">
            <h3>Reset Admin Password</h3>
            <p>Enter your admin username and we'll send you a link to reset your password.</p>
            <input type="text" id="resetUser" class="input-field" placeholder="Enter admin username" autocomplete="off" />
            <div id="modalMsg" class="modal-message"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn-send" id="modalSend">Send Reset Link</button>
            </div>
        </div>
    </div>

    <script src="assets/js/admin-login.js"></script>
</body>
</html>
